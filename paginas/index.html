<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Ossidem - Breaking News</title>
</head>

<body>
    <div class="header">
        <div class="logo-group">
            <img class="logoBrain" src="../imagens/logoBrain.svg" alt="Logo Brain">
            <a href="#">OssidemNews</a>
        </div>

        <nav class="links-navegacao">
            <a href="#">News</a>
            <a href="#">Feed</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </div>

    <div class="main">
        <div class="conteiner1">
            <h1 class="titulo-principal">Veja as principais notícias do momento</h1>
            <p class="paragrafo1">No mundo de hoje quem se informa não fica pra traz</p>
        </div>

        <div class="conteiner2" id="area-noticia"></div>
        <div class="botoes-navegacao">
            <button id="btnAnterior">Anterior</button>
            <button id="btnProximo">Próximo</button>
            <button id="btnVoltar">Voltar</button>

            <div class="painel-admin"
                style="background: #e0e0e0; padding: 20px; margin-bottom: 20px; border-radius: 8px; width: 100%; max-width: 1000px;">
                <h3>Painel Administrativo</h3>
                <div class="form-group">
                    <input type="text" id="novoTitulo" placeholder="Título da Notícia">
                    <input type="text" id="novaDescricao" placeholder="Descrição curta">
                    <button id="btnAdicionar">Adicionar Notícia</button>
                </div>
                <div class="form-group" style="margin-top: 10px;">
                    <input type="number" id="idRemover" placeholder="ID para remover">
                    <button id="btnRemover">Remover por ID</button>
                </div>
            </div>


        </div>


    </div>



    <div class="footer">
        footer
    </div>


    <script type="module" src="../feed.js"></script>

</body>

</html>
